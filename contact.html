<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي - Contact Me</title>
</head>
<body>

    <!-- الترويسة الرئيسية -->
    <header>
        <h1>نموذج التواصل - Contact Form</h1>
        <nav>
            <ul>
                <li><a href="index.html">الصفحة الرئيسية (Home)</a></li>
                <li><a href="projects.html">المشاريع (Projects)</a></li>
                <li><a href="contact.html">تواصل معي (Contact)</a></li>
            </ul>
        </nav>
    </header>

    <!-- المحتوى الرئيسي للنموذج -->
    <main>
        <section id="contact-section">
            <h2>أرسل لي رسالة (Send a Message)</h2>
            
            <form action="#" method="POST">
                
                <!-- حقل اسم المستخدم -->
                <div>
                    <label for="username">الاسم الكامل (Full Name):</label>
                    <input type="text" id="username" name="username" placeholder="أدخل اسمك هنا" required>
                </div>

                <br>

                <!-- حقل البريد الإلكتروني -->
                <div>
                    <label for="user-email">البريد الإلكتروني (Email Address):</label>
                    <input type="email" id="user-email" name="user_email" placeholder="name@example.com" required>
                </div>

                <br>

                <!-- حقل اختيار نوع الرسالة -->
                <div>
                    <label for="subject">سبب التواصل (Subject):</label>
                    <select id="subject" name="subject">
                        <option value="general">استفسار عام (General Inquiry)</option>
                        <option value="project">مشروع جديد (New Project)</option>
                        <option value="hiring">فرصة عمل (Job Opportunity)</option>
                    </select>
                </div>

                <br>

                <!-- حقل كتابة النص الطويل -->
                <div>
                    <label for="message">الرسالة (Message):</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="اكتب رسالتك بالتفصيل هنا..." required></textarea>
                </div>

                <br>

                <!-- زر الإرسال -->
                <button type="submit">إرسال الرسالة (Submit)</button>
                <button type="reset">إعادة ضبط (Reset)</button>

            </form>
        </section>
    </main>

    <!-- التذييل -->
    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - أسامة سعد</p>
    </footer>

</body>
</html>
