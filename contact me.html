  <main>
    <section>
        <h2>contact me</h2>
        <p>in this page to entr your for contact us</p>
        <!-- data form -->
        <form action="#" method="post">
          <div>
            <label for="name" >username:</label>
            <input type="text" id="name" name="name" placeholder="entr your name" required>
            </div>
          <br>
          <div>
            <label for="email">email:</label>
            <input type="email" id="email" name="email" placeholder="entr your email" required>
            </div>
            <br>
            <div>
            <label for="subject">inquriy type:</label>
            <select id="subject" name="subject">
              <option value="support">support</option>
              <option value="sales">sales</option>
              <option value="general">general</option> 
            </select>
            </div>
            <br>
            <div>
              <label for="message">message:</label>
              <textarea id="message" name="message" placeholder="entr your message" rows="5" cols="40"></textarea>
            </div>
            <br>
            <div>
              <button type="submit" >send</button>
            </div>
          
        </form>
    </section>
